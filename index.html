*{box-sizing:border-box}
html{overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;-webkit-text-size-adjust:100%}
body.playing{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.playing #app{padding:4px 16px 4px}
body.playing #mute{width:32px;height:32px;top:2px;right:8px;font-size:16px}
#btnHow{display:block;margin:8px auto 0;min-height:36px;border:0;border-radius:18px;background:var(--btn3);color:var(--btn3-text);font-size:14px;font-weight:800;font-family:inherit;padding:0 18px;touch-action:manipulation}
#howBox{margin-top:8px;font-size:14px;line-height:1.7;background:var(--bg);border-radius:14px;padding:10px 12px}
.chip .hl{display:block;font-size:10px;line-height:11px;color:var(--pellet);letter-spacing:1px}
#net{position:fixed;top:12px;left:0;right:0;text-align:center;pointer-events:none;font-size:11px;font-weight:700;color:var(--warn);z-index:6}
#app{max-width:440px;margin:0 auto;padding:14px 16px 28px}
section[hidden],[hidden]{display:none!important}
h1{margin:6px 0 4px;text-align:center;font-size:30px;line-height:1.15;letter-spacing:1px;color:var(--text)}
h1 span{display:block;color:var(--btn);font-size:34px}
h2{margin:8px 0;text-align:center}
.card{background:var(--card);border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 4px 0 var(--shadow)}
.lbl{font-size:13px;color:var(--sub);margin:6px 0 4px;font-weight:700}
.small{font-size:12px;color:var(--sub);margin:6px 0}
.note{min-height:18px;text-align:center;font-size:13px;color:var(--warn);font-weight:700;margin:4px 0}
input{width:100%;height:46px;border-radius:14px;border:3px solid var(--btn3);background:var(--bg);color:var(--text);font-size:20px;padding:0 12px;font-family:inherit;text-align:center}
input:focus{outline:3px solid var(--focus);outline-offset:1px}
.btn{display:block;width:100%;min-height:54px;margin:8px 0;border:0;border-radius:27px;background:var(--btn);color:var(--btn-text);font-size:19px;font-weight:800;font-family:inherit;box-shadow:0 4px 0 var(--shadow);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.btn.b2{background:var(--btn2)}
.btn.b3{background:var(--btn3);color:var(--btn3-text)}
.btn:disabled{background:var(--disabled);color:var(--sub);box-shadow:none}
.btn:focus-visible,.cbtn:focus-visible,#mute:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.spd{display:flex;margin:6px 0 2px}
.spd button+button{margin-left:8px}
.spd button{flex:1;min-height:48px;border:3px solid var(--btn3);border-radius:16px;background:var(--btn3);color:var(--btn3-text);font-size:16px;font-weight:800;font-family:inherit;touch-action:manipulation}
.spd button[aria-pressed="true"]{background:var(--btn2);border-color:var(--text);color:#fff}
.spd button:disabled{opacity:.75}
.spd button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.joinrow{display:flex;align-items:center}
.joinrow .btn{margin:8px 0 8px 8px}
.joinrow input{width:110px;flex:none;letter-spacing:4px;text-transform:uppercase}
.joinrow .btn{margin:8px 0}
.colors{display:flex;justify-content:center;margin:6px 0 2px}
.cbtn+.cbtn{margin-left:8px}
.cbtn{width:48px;height:48px;border-radius:50%;border:4px solid var(--btn3);padding:0;position:relative;touch-action:manipulation}
.cbtn[aria-pressed="true"]{border-color:var(--text);transform:scale(1.08)}
.cbtn:disabled{background:var(--disabled)!important;opacity:.55}
.code{font-size:38px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--btn2)}
ul{list-style:none;margin:6px 0;padding:0}
li>*+*{margin-left:10px}
li{display:flex;align-items:center;padding:7px 4px;font-size:18px;font-weight:700;border-bottom:2px dashed var(--btn3)}
.cdot{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid var(--outline);flex:none}
.tag{font-size:11px;background:var(--btn2);color:#fff;border-radius:10px;padding:2px 8px;font-weight:700}
.tag.t2{background:var(--btn)}
.tag.t3{background:var(--disabled);color:var(--text)}
#logo{display:block;width:100%;height:84px}
#mute{position:fixed;top:8px;right:8px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--text);font-size:20px;box-shadow:0 3px 0 var(--shadow);touch-action:manipulation}
/* game */
#sGame{padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{display:flex;align-items:center;justify-content:space-between;padding:0 48px 0 4px;height:22px}
#timer{font-size:16px;font-weight:900}
.chips{display:flex;margin:0 0 2px}
.chip+.chip{margin-left:6px}
.chip{flex:1;min-width:0;background:var(--card);border-radius:10px;padding:0 4px;text-align:center;border:2px solid transparent}
.chip.me{border-color:var(--text)}
.chip.gone{opacity:.5}
.chip .cn{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub);font-weight:700;display:block}
.chip .cs{font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}
.chip .cs>*+*{margin-left:5px}
.chip .cdot{width:13px;height:13px}
#cv{display:block;margin:0 auto;border-radius:14px;touch-action:none}
#gmsg{text-align:center}
#gmsg:empty{display:none}
#pad{display:block;margin:4px -16px 0;touch-action:none}
/* result */
ol{list-style:none;margin:10px 0;padding:0}
.rrow>*+*{margin-left:10px}
.rrow{display:flex;align-items:center;background:var(--card);border-radius:18px;padding:10px 12px;margin:8px 0;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--shadow)}
.rrow .rk{width:34px;text-align:center;font-size:22px}
.rrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow.gone{opacity:.55}
.rrow.first{border:3px solid var(--p0)}
</style>
</head>
<body>
<div id="net" hidden>つながりにくいよ</div>
<main id="app">
  <button id="mute" aria-label="おと">♪</button>

  <section id="sLobby">
    <h1>まるまる<span>ドット大会</span></h1>
    <canvas id="logo"></canvas>
    <div class="card">
      <label class="lbl" for="name">なまえ(6もじまで)</label>
      <input id="name" maxlength="6" autocomplete="off" placeholder="なまえ">
      <div class="lbl">いろをえらぼう</div>
      <div id="colors" class="colors"></div>
      <div class="lbl">ボタンのおおきさ</div>
      <div id="padsz" class="spd"></div>
      <div class="lbl">スピード</div>
      <div id="spd" class="spd"></div>
      <div class="lbl">モード</div>
      <div id="mode" class="spd"></div>
      <div id="spdNote" class="small" style="text-align:center" hidden>スピードとモードはホストがきめるよ</div>
      <button id="btnHow" type="button">あそびかた</button>
      <div id="howBox" hidden></div>
    </div>
    <div id="menuBox" class="card">
      <button id="btnSolo" class="btn">ひとりで遊ぶ</button>
      <div id="onlineBtns" hidden>
        <button id="btnCreate" class="btn b2">へやをつくる</button>
        <div class="joinrow">
          <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="コード" aria-label="へやコード">
          <button id="btnJoin" class="btn b2">へやに入る</button>
        </div>
      </div>
      <p id="hi" class="small" style="text-align:center"></p>
    </div>
    <div id="roomBox" class="card" hidden>
      <div class="small" style="text-align:center">へやコード(ともだちにおしえてね)</div>
      <div id="roomCode" class="code"></div>
      <ul id="plist"></ul>
      <p id="roomMsg" class="small" style="text-align:center"></p>
      <button id="btnStart" class="btn">スタート</button>
      <button id="btnLeave" class="btn b3">でる</button>
    </div>
    <p id="note" class="note" role="status"></p>
  </section>

  <section id="sGame" hidden>
    <div class="hud" id="hudbar"><div id="timer">のこり 90</div></div>
    <div class="chips" id="chips"></div>
    <canvas id="cv"></canvas>
    <div id="gmsg" class="small"></div>
    <canvas id="pad" aria-label="うごかすボタン"></canvas>
  </section>

  <section id="sResult" hidden>
    <h2 id="resTitle">けっか</h2>
    <ol id="resList"></ol>
    <p id="resMsg" class="small" style="text-align:center"></p>
    <button id="btnAgain" class="btn">もういちど</button>
    <button id="btnBack" class="btn b3">ロビーへ</button>
  </section>
</main>

    const live = list.filter((x) => !x.gone);
    if (surv) {
      for (const x of live) x.rank = 1 + live.filter((y) => y.k > x.k + 0.2 || Math.abs(y.k - x.k) <= 0.2 && y.sc > x.sc).length;
      for (const x of list) if (x.gone) x.rank = 99;
      list.sort((a, b) => a.rank - b.rank || (Math.abs(a.k - b.k) > 0.2 ? b.k - a.k : b.sc - a.sc) || a.i - b.i);
    } else {
      for (const x of list) x.rank = x.gone ? 99 : 1 + live.filter((y) => y.sc > x.sc).length;
      list.sort((a, b) => a.rank - b.rank || b.sc - a.sc || a.i - b.i);
    }
    const ol = $("resList");
    ol.textContent = "";
    for (const x of list) {
      const li = document.createElement("li");
      li.className = "rrow" + (x.gone ? " gone" : "") + (x.rank === 1 ? " first" : "");
      const rk = document.createElement("span");
      rk.className = "rk";
      rk.textContent = x.gone ? "" : x.rank === 1 ? "\u{1F451}" : String(x.rank);
      const dot = document.createElement("span");
      dot.className = "cdot";
      dot.style.background = "var(--p" + slotCol[x.i] + ")";
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = names[x.i] || "\u306A\u306A\u3057";
      const pt = document.createElement("span");
      if (x.gone) pt.textContent = "\u306C\u3051\u305F";
      else if (surv) {
        pt.style.fontSize = "15px";
        pt.textContent = (x.al ? "\u3044\u304D\u306E\u3053\u308A! " : "") + fmtT(x.al ? tm[x.i] : x.k) + " / " + x.sc + "\u70B9";
      } else pt.textContent = x.sc + "\u70B9";
      li.appendChild(rk);
      li.appendChild(dot);
      li.appendChild(nm);
      li.appendChild(pt);
      ol.appendChild(li);
    }
    let msg = "";
    if (solo && surv) {
      const t = mySlot >= 0 ? Math.floor(tm[mySlot]) : 0, bt = num(store.get("mdt_bt"));
      if (t > bt) {
        store.set("mdt_bt", String(t));
        msg = "\u3042\u305F\u3089\u3057\u3044\u30D9\u30B9\u30C8! ";
      }
      msg += "\u3044\u304D\u306E\u3053\u3063\u305F\u6642\u9593 " + fmtT(t) + " / " + (mySlot >= 0 ? sc[mySlot] : 0) + "\u70B9 / \u30D9\u30B9\u30C8 " + fmtT(Math.max(t, bt));
      $("resTitle").textContent = "\u304A\u3064\u304B\u308C\u3055\u307E!";
    } else if (solo) {
      const mine = mySlot >= 0 ? sc[mySlot] : 0, hi = num(store.get("mdt_hi"));
      if (mine > hi) {
        store.set("mdt_hi", String(mine));
        msg = "\u3042\u305F\u3089\u3057\u3044\u30D9\u30B9\u30C8\u30B9\u30B3\u30A2!";
      } else msg = "\u30D9\u30B9\u30C8: " + hi + "\u70B9";
      $("resTitle").textContent = "\u304A\u3064\u304B\u308C\u3055\u307E!";
    } else if (surv) {
      const win = list.filter((x) => x.rank === 1 && !x.gone).map((x) => names[x.i] || "\u306A\u306A\u3057");
      const any = list.some((x) => x.rank === 1 && x.al);
      $("resTitle").textContent = win.length ? win.join("\u30FB") + (any ? " \u306E \u3044\u304D\u306E\u3053\u308A!" : " \u304C \u3055\u3044\u3054\u307E\u3067!") : "\u3051\u3063\u304B";
      msg = mySlot < 0 ? "\u307F\u3093\u306A\u304A\u3064\u304B\u308C\u3055\u307E!" : "";
    } else {
      const top = live.length ? Math.max(...live.map((x) => x.sc)) : 0;
      const win = live.filter((x) => x.sc === top).map((x) => names[x.i] || "\u306A\u306A\u3057");
      $("resTitle").textContent = win.length ? win.join("\u30FB") + " \u306E\u304B\u3061!" : "\u3051\u3063\u304B";
      msg = mySlot < 0 ? "\u307F\u3093\u306A\u304A\u3064\u304B\u308C\u3055\u307E!" : "";
    }
    $("resMsg").textContent = msg;
    beep(660, 0.15, "square", 0.06);
    beep(880, 0.15, "square", 0.06, 0.15);
    beep(1320, 0.3, "square", 0.06, 0.3);
    show("sResult");
  }
  buildColors();
  buildSpd();
  buildMode();
  buildPadSz();
  $("btnHow").addEventListener("click", () => {
    $("howBox").hidden = !$("howBox").hidden;
    layout();
  });
  layout();
  refreshLobby();
  updMute();
  requestAnimationFrame(frame);
  initRoom();
})();
</script>
</body>
</html>
